{{- $vaultixValues := .Values.vaultix }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vaultix.fullname" . }}
  annotations:
    updatedAt: {{ now | date "2006-01-01 MST 15:04:05" | quote }}
    {{- with $vaultixValues.deploymentAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  labels:
    {{- include "vaultix.labels" . | nindent 4 }}
spec:
  replicas: {{ $vaultixValues.replicaCount }}
  selector:
    matchLabels:
      {{- include "vaultix.matchLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vaultix.matchLabels" . | nindent 8 }}
      annotations:
        updatedAt: {{ now | date "2006-01-01 MST 15:04:05" | quote }}
        {{- with $vaultixValues.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "vaultix.serviceAccountName" . }}
    {{- with $vaultixValues.podSecurityContext }}
      securityContext: {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with $vaultixValues.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- with $vaultixValues.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with $vaultixValues.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with $vaultixValues.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- if $vaultixValues.image.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml $vaultixValues.image.imagePullSecrets | nindent 6 }}
    {{- end }}
    {{- with $vaultixValues.extraInitContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
    {{- end }}
      containers:
      - name: {{ template "vaultix.name" . }}-{{ $vaultixValues.name }}
        image: "{{ $vaultixValues.image.repository }}:{{ $vaultixValues.image.tag }}"
        imagePullPolicy: {{ $vaultixValues.image.pullPolicy }}
        {{- with $vaultixValues.containerSecurityContext }}
        securityContext: {{- toYaml . | nindent 10 }}
        {{- end }}
        readinessProbe:
          httpGet:
            path: /api/status
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
        ports: 
        - containerPort: 8080
        env:
        {{- if .Values.postgresql.useExistingPostgresSecret.enabled }}
        - name: DB_CONNECTION_URI
          valueFrom:
            secretKeyRef:
              name: {{ .Values.postgresql.useExistingPostgresSecret.existingConnectionStringSecret.name }}
              key: {{ .Values.postgresql.useExistingPostgresSecret.existingConnectionStringSecret.key }}
        {{- end }}
        {{- if .Values.postgresql.enabled }}
        - name: DB_CONNECTION_URI
          value: {{ include "vaultix.postgresDBConnectionString" . }}
        {{- end }}
        {{- if .Values.redis.enabled }}
        - name: REDIS_URL
          value: {{ include "vaultix.redisConnectionString" . }}
        {{- end }}
        {{- with $vaultixValues.extraEnv }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        envFrom:
        - secretRef:
            name: {{ $vaultixValues.kubeSecretRef }}
        {{- if  $vaultixValues.resources }}
        resources: {{- toYaml $vaultixValues.resources | nindent 12 }}
        {{- end }}
        {{- with $vaultixValues.extraVolumeMounts }}
        volumeMounts:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- with $vaultixValues.extraContainers }}
        {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- with $vaultixValues.extraVolumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---

apiVersion: v1
kind: Service 
metadata:
  name: {{ include "vaultix.fullname" . }}
  labels:
    {{- include "vaultix.labels" . | nindent 4 }}
  {{- with $vaultixValues.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $vaultixValues.service.type }}
  selector:
    {{- include "vaultix.matchLabels" . | nindent 8 }}
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      {{- if eq $vaultixValues.service.type "NodePort" }}
      nodePort: {{ $vaultixValues.service.nodePort }}
      {{- end }}
