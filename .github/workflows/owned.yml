# Prove this tree is Vaultix (owned engine + overlay), not a leftover clone.
name: owned

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: panel/go.mod
          cache-dependency-path: panel/go.sum
      - name: ripgrep
        run: sudo apt-get update -qq && sudo apt-get install -y ripgrep
      - name: owned check
        run: bash scripts/check-owned.sh
      - name: panel tests
        working-directory: panel
        run: go test ./...
