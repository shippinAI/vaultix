# Push Vaultix to GitHub Container Registry.
# Images:
#   ghcr.io/shippinai/vaultix        — engine (owned MIT core)
#   ghcr.io/shippinai/vaultix-panel  — overlay (PIN, lessons, Clyffy, manager)
#
# Requires:
#   - this file on the default branch
#   - packages:write (set below). GITHUB_TOKEN is enough.
# Org Actions packages write: https://github.com/organizations/shippinAI/settings/actions
name: GHCR

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/vaultix-panel" >> "$GITHUB_OUTPUT"

      - name: Push ${{ steps.image.outputs.name }}
        uses: docker/build-push-action@v7
        with:
          context: panel
          file: panel/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.title=Vaultix panel
            org.opencontainers.image.vendor=AngryVibes LLC
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7

      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          df -h

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/vaultix" >> "$GITHUB_OUTPUT"

      - name: Push ${{ steps.image.outputs.name }}
        uses: docker/build-push-action@v7
        with:
          context: core
          file: core/Dockerfile.ghcr
          push: true
          provenance: false
          sbom: false
          build-args: |
            VAULTIX_PLATFORM_VERSION=0.162.19
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:0.162.19
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.title=Vaultix
            org.opencontainers.image.vendor=AngryVibes LLC
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=0.162.19
