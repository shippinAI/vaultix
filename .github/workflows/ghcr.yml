# Push Vaultix to GitHub Container Registry.
# Images:
#   ghcr.io/shippinai/vaultix        — engine (owned MIT core)
#   ghcr.io/shippinai/vaultix-panel  — overlay (PIN, lessons, Clyffy, manager)
#
# Requires:
#   - this file on the default branch
#   - packages:write (set below). GITHUB_TOKEN is enough.
# Org Actions packages write: https://github.com/organizations/shippinAI/settings/actions
name: GHCR

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    # Pinned Playwright supports 24.04; ubuntu-latest moved to unsupported 26.04.
    runs-on: ubuntu-24.04
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - name: Verify source review inventory
        run: node scripts/audit-codebase.mjs --check
      - name: Verify migration map and dependency gates
        run: |
          node scripts/test-migration-map.mjs
          node scripts/map-migration.mjs --check
      - name: Verify guided interaction state
        run: node --experimental-strip-types scripts/test-guided-interactions.mjs
      - name: Verify capability surface guard
        run: node scripts/test-capability-surface.mjs
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache-dependency-path: |
            go.sum
            panel/go.sum
            core/backend-go/go.sum
      - run: go test ./...
      - run: go test ./...
        working-directory: panel
      - run: bash scripts/check-owned.sh
      - run: npx --yes npm@10.9.0 ci --ignore-scripts --no-audit --no-fund
        working-directory: core/backend
      - run: node --max-old-space-size=8192 node_modules/typescript/bin/tsc --noEmit
        working-directory: core/backend
      - name: Audit production dependencies
        run: |
          mkdir -p .cache
          cd core/backend
          npm audit --omit=dev --audit-level=critical --json > ../../.cache/backend-production-audit.json
      - run: npm run build
        working-directory: core/backend
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: core/frontend
      - name: Build UI and verify startup dependencies
        run: npx tsc -b && node ../../scripts/build-ui-report.mjs
        working-directory: core/frontend
      - name: Preserve existing application routes
        run: node scripts/check-capability-surface.mjs --check-ui
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: core/e2e
      - run: npx playwright install --with-deps chromium
        working-directory: core/e2e
      - name: Verify native browser states
        run: node scripts/test-native-ui.mjs
      - name: Enforce cold login loading budget
        run: node scripts/check-ui-loading.mjs
      - name: Preserve browser and dependency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vaultix-browser-and-dependencies
          include-hidden-files: true
          path: |
            .cache/ui-proof-*/*.png
            .cache/ui-proof-*/accessibility.json
            .cache/loading-proof-*/*.png
            .cache/loading-proof-*/result.json
            .cache/loading-proof-*/startup-failure.json
            .cache/bundle-proof-*/*.json
            .cache/backend-production-audit.json
          if-no-files-found: warn
      - run: go test ./internal/ee/services/license ./internal/config ./internal/database/redis
        working-directory: core/backend-go
      - run: go test ./...
        working-directory: core/backend-go/third_party/gocasl

  panel:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/vaultix-panel" >> "$GITHUB_OUTPUT"

      - name: Push ${{ steps.image.outputs.name }}
        uses: docker/build-push-action@v7
        with:
          context: panel
          file: panel/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.title=Vaultix panel
            org.opencontainers.image.vendor=AngryVibes LLC
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

  engine:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7

      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          df -h

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/vaultix" >> "$GITHUB_OUTPUT"

      - name: Build standalone Vaultix for verification
        uses: docker/build-push-action@v7
        with:
          context: core
          file: core/Dockerfile.standalone-vaultix
          load: true
          push: false
          provenance: false
          sbom: false
          build-args: |
            VAULTIX_PLATFORM_VERSION=0.162.19
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:0.162.19
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.title=Vaultix
            org.opencontainers.image.vendor=AngryVibes LLC
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=0.162.19

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: core/e2e
      - run: npx playwright install --with-deps chromium
        working-directory: core/e2e

      - name: Verify image with Dragonfly and real application sign-in
        env:
          VAULTIX_IMAGE_APP_PROOF: '1'
        run: bash scripts/smoke-image.sh '${{ steps.image.outputs.name }}:${{ github.sha }}' dragonfly

      - name: Verify image with Redis
        run: bash scripts/smoke-image.sh '${{ steps.image.outputs.name }}:${{ github.sha }}' redis

      - name: Build database capability test runtime
        uses: docker/build-push-action@v7
        with:
          context: core
          file: core/Dockerfile.standalone-vaultix
          target: backend-build
          load: true
          push: false
          tags: vaultix:verify-backend

      - name: Verify backend unit suite
        run: node scripts/test-unit-core.mjs

      - name: Verify capabilities with Dragonfly
        run: node scripts/test-core.mjs dragonfly

      - name: Verify capabilities with Redis
        run: node scripts/test-core.mjs redis

      - name: Preserve capability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vaultix-capability-results
          include-hidden-files: true
          path: |
            .cache/core-proof-*/test-results.json
            .cache/unit-proof-*/test-results.json
            .cache/app-image-proof-*/result.json
            .cache/app-image-proof-*/dashboard-recovery.json
            .cache/app-image-proof-*/chart-rendering.json
            .cache/app-image-proof-*/chart-accessibility.json
            .cache/app-image-proof-*/chart-layout.json
            .cache/app-image-proof-*/chart-filter-failure.json
            .cache/app-image-proof-*/accessibility.json
            .cache/app-image-proof-*/*.png
          if-no-files-found: warn

      - name: Publish verified engine image
        run: |
          docker push '${{ steps.image.outputs.name }}:${{ github.sha }}'
          docker push '${{ steps.image.outputs.name }}:0.162.19'
          docker push '${{ steps.image.outputs.name }}:latest'
