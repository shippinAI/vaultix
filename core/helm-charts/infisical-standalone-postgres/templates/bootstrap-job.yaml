{{- $vaultixValues := .Values.vaultix }}
{{- if $vaultixValues.autoBootstrap.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ .Release.Name }}-bootstrap-{{ .Release.Revision }}"
  annotations:
    "helm.sh/hook": post-install
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation
  labels:
    helm.sh/chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
spec:
  backoffLimit: 3
  template:
    metadata:
      name: "{{ .Release.Name }}-bootstrap"
      labels:
        app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
        helm.sh/chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    spec:
      serviceAccountName: {{ include "vaultix.serviceAccountName" . }}
    {{- with $vaultixValues.podSecurityContext }}
      securityContext: {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- if $vaultixValues.image.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml $vaultixValues.image.imagePullSecrets | nindent 6 }}
    {{- end }}
      restartPolicy: OnFailure
      initContainers:
      - name: wait-for-vaultix
        image: curlimages/curl:8.14.1
        {{- with $vaultixValues.containerSecurityContext }}
        securityContext: {{- toYaml . | nindent 10 }}
        {{- end }}
        command: ['sh', '-c']
        args:
        - |
          echo "Waiting for vaultix to be ready..."
          until curl -f http://{{ include "vaultix.fullname" . }}:8080/api/status; do
            echo "vaultix not ready yet, retrying in 10 seconds..."
            sleep 10
          done
          echo "vaultix is ready! Proceeding with bootstrap..."
      containers:
        - name: vaultix-bootstrap
          image: "vaultix/cli:{{ $vaultixValues.autoBootstrap.image.tag }}"
          imagePullPolicy: {{ $vaultixValues.image.pullPolicy | default "IfNotPresent" }}
          {{- with $vaultixValues.containerSecurityContext }}
          securityContext: {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            - bootstrap
            - --domain=http://{{ include "vaultix.fullname" . }}:8080
            - --output=k8-secret
            - --k8-secret-name={{ $vaultixValues.autoBootstrap.secretDestination.name }}
            - --k8-secret-namespace={{ $vaultixValues.autoBootstrap.secretDestination.namespace | default .Release.Namespace }}
            - --organization={{ $vaultixValues.autoBootstrap.organization }}
            - --k8-secret-template={{ $vaultixValues.autoBootstrap.secretTemplate }}
            - --ignore-if-bootstrapped=true
          envFrom:
            - secretRef:
                name: {{ $vaultixValues.autoBootstrap.credentialSecret.name }}
{{- end }}
